<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Beets &amp; Co — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="apple-touch-icon" sizes="180x180" href="../assets//favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
<link rel="manifest" href="../assets/favicon/site.webmanifest">
<link rel="shortcut icon" href="../assets/favicon/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/command.css"/>
<link rel="stylesheet" href="css/business.css"/>
<link rel="stylesheet" href="css/tax.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --ink:#262522; --ink-soft:#3a3833; --paper:#f4f1ea; --paper2:#ece7dc;
    --card:#ffffff; --line:#ded7c8; --muted:#8a8377; --accent:#7d6b4f; --accent-deep:#5f5138;
    --good:#5b7a53; --warn:#b8863b; --bad:#a8543f; --shadow:0 1px 3px rgba(38,37,34,.08),0 6px 20px rgba(38,37,34,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Montserrat',sans-serif;font-size:14px;line-height:1.5}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.2px;margin:0}
  a{color:var(--accent-deep)}
  .hidden{display:none !important}

  /* Gate */
  #gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:1000}
  #gate .box{background:var(--paper);padding:40px;border-radius:6px;width:min(360px,90vw);text-align:center;box-shadow:var(--shadow)}
  #gate h1{font-size:34px;margin-bottom:6px}
  #gate p{color:var(--muted);margin:0 0 22px}
  #gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:5px;font-size:15px;font-family:inherit;margin-bottom:12px}
  #gate button{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:5px;font-family:inherit;font-weight:600;cursor:pointer;font-size:14px}
  #gate .err{color:var(--bad);font-size:12px;height:16px;margin-top:8px}

  /* Header */
  header{background:var(--ink);color:#efe9dd;padding:16px 24px}
  .head-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#fff}
  .brand small{font-family:'Montserrat';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a89f8c;display:block;margin-top:-4px}
  .nap-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:#cfc7b6;margin-top:12px}
  .nap-bar b{color:#fff;font-weight:600}
  .btn-mini{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:5px 10px;font-family:inherit;font-size:11px;cursor:pointer}
  .btn-mini:hover{background:rgba(255,255,255,.22)}
  #clientPicker{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:5px 10px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer}
  #clientPicker option{color:#000}
  .rule{margin-top:10px;font-size:11.5px;color:#a89f8c;font-style:italic;max-width:900px}

  /* Tabs */
  nav{background:var(--paper2);border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
  nav button{background:none;border:none;padding:13px 15px;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  nav button:hover{color:var(--ink)}
  nav button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav .badge{background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:5px}

  main{max-width:1100px;margin:0 auto;padding:26px 20px 80px}
  .tabhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .tabhead h2{font-size:30px}
  .tabhead .sub{color:var(--muted);font-size:12.5px;max-width:640px;margin-top:4px}
  .btn-add{background:var(--ink);color:#fff;border:none;border-radius:5px;padding:9px 16px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
  .btn-add:hover{background:var(--ink-soft)}

  /* Cards */
  .cards{margin-top:18px;display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative}
  .card.saved{outline:2px solid var(--good);outline-offset:-2px;transition:outline .2s}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.full{grid-column:1/-1}
  .f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
  .f input[type=text],.f input[type=url],.f input[type=email],.f input[type=number],.f input[type=date],.f select,.f textarea{
    border:1px solid var(--line);border-radius:5px;padding:8px 9px;font-family:inherit;font-size:13px;background:#fdfcf9;color:var(--ink);width:100%}
  .f textarea{resize:vertical;min-height:60px;line-height:1.45}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
  .checks{display:flex;flex-wrap:wrap;gap:8px 14px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .chk input{width:15px;height:15px;accent-color:var(--accent)}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--paper2)}
  .card-foot .meta{font-size:11px;color:var(--muted)}
  .btn-del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:5px 10px;font-family:inherit;font-size:11px;cursor:pointer}
  .btn-del:hover{border-color:var(--bad);color:var(--bad)}

  /* Status pill select */
  select.status{font-weight:600;border-width:1.5px}
  .empty{text-align:center;color:var(--muted);padding:40px;font-style:italic;border:1px dashed var(--line);border-radius:7px}

  /* Content library: filters + collapsible cards */
  .filterbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0 4px}
  .filterbar .flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink-soft)}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .filterbar .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .filterbar select{padding:6px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:5px;font-family:inherit;background:#fff;color:var(--ink-soft);cursor:pointer}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:11px}
  .ccard.saved{outline:2px solid var(--good);outline-offset:-2px}
  .ccard-head{display:flex;align-items:center;gap:14px;padding:10px 12px;cursor:pointer}
  .ccard-head:hover{background:var(--paper2)}
  .thumb,.thumb-ph{width:96px;height:66px;border-radius:5px;flex-shrink:0;background:var(--paper2)}
  .thumb{object-fit:cover}
  .thumb-ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
  .ccard-meta{flex:1;min-width:0}
  .ccard-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ccard-tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
  .pill{font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 9px;color:#fff;letter-spacing:.3px;white-space:nowrap}
  .pill.status{background:var(--muted)}
  .ar{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .desc-prev{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
  .expand-btn{background:none;border:none;font-size:15px;color:var(--muted);cursor:pointer;padding:6px;flex-shrink:0}
  .expand-col{display:flex;flex-direction:column;align-items:center;gap:0}
  .cal-meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
  .plat-icons{display:flex;gap:4px;font-size:13px;line-height:1}
  .plat-icons span{filter:grayscale(0)}
  .pillar-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:5px;vertical-align:middle}
  .ccard-body{padding:14px;border-top:1px solid var(--paper2)}
  .ccard-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .ccard-links{font-size:11.5px;margin-top:6px;display:flex;gap:12px}
  .ccard-links a{color:var(--accent-deep);text-decoration:none;font-weight:600}
  .ccard-links a:hover{text-decoration:underline}
  .assigned{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;background:var(--paper2);border-radius:6px;font-size:12px}
  .mini-thumb{width:64px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0}
  .assigned a{color:var(--accent-deep);font-weight:600;white-space:nowrap}
  .cref-filter{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .cref-filter select{padding:5px 7px;font-size:12px;border:1px solid var(--line);border-radius:5px;font-family:inherit;background:#fff}
  .cref-note{font-size:11px;color:var(--muted)}
  .reco{font-size:11.5px;color:var(--accent-deep);margin-top:5px}
  .btn-sm{font-size:10.5px;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;font-family:inherit;cursor:pointer;color:var(--ink-soft);margin-left:4px}
  .btn-sm:hover{border-color:var(--accent)}
  .sched{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sched input{padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12px}

  /* Publish block (calendar cards) */
  .publish-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--paper2)}
  .publish-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .publish-links{font-size:11.5px;display:flex;gap:10px}
  .publish-links a{font-weight:600}
  .publish-error{font-size:11.5px;color:var(--bad);margin-top:6px}
  .pill.status-not-queued{background:var(--muted)}
  .pill.status-processing{background:var(--warn)}
  .pill.status-published{background:var(--good)}
  .pill.status-partial{background:var(--warn)}
  .pill.status-failed{background:var(--bad)}
  .publish-plat-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .publish-plat-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 8px;border-radius:6px;background:var(--paper2)}
  .publish-plat-label{font-weight:600;min-width:92px}
  .publish-plat-text{color:var(--muted);flex:1}
  .publish-plat-row a{font-weight:600;white-space:nowrap}
  .publish-plat-fail{background:rgba(168,84,63,.1)}
  .publish-plat-fail .publish-plat-text{color:var(--bad);font-weight:600}
  .publish-plat-ok{background:rgba(91,122,83,.1)}
  .publish-plat-wait{background:rgba(184,134,59,.1)}

  /* Preview modal */
  .preview-modal{position:fixed;inset:0;background:rgba(38,37,34,.75);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
  .preview-box{background:var(--card);border-radius:8px;width:min(760px,95vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
  .preview-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--paper2);font-weight:600;font-size:14px}
  .preview-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:2px 8px;line-height:1}
  .preview-close:hover{color:var(--bad)}
  .preview-body{flex:1;min-height:320px;background:#141312;display:flex;align-items:center;justify-content:center}
  .preview-body iframe{width:100%;height:70vh;border:none}
  .preview-body video{max-width:100%;max-height:70vh}
  .preview-body img{max-width:100%;max-height:70vh;object-fit:contain}
  .preview-body .empty{color:#cfc7b6;border:none}

  /* Dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px;box-shadow:var(--shadow)}
  .stat .n{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;line-height:1}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h3{font-size:21px;margin-bottom:12px}
  .anchor{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper2)}
  .anchor:last-child{border-bottom:none}
  .anchor input{width:18px;height:18px;accent-color:var(--good)}
  .anchor label{font-size:13.5px}
  .anchor.done label{text-decoration:line-through;color:var(--muted)}
  .docs-links{display:flex;flex-wrap:wrap;gap:8px}
  .docs-links span{background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--ink-soft)}
  .callout{background:var(--paper2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 5px 5px 0;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;z-index:200;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:600px){.tabhead h2{font-size:24px}main{padding:18px 12px 70px}}

  /* ── Section switcher (Workspace / Business / Command, owner only) ── */
  #sections{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-right:6px}
  #sections:empty{display:none}
  #sections button{background:transparent;border:none;color:#cfc8ba;padding:5px 13px;border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
  #sections button:hover{color:#fff}
  #sections button.active{background:var(--paper);color:var(--ink)}
  /* ── Global tabs hide per-client chrome ── */
  header.global-mode #clientPicker, header.global-mode .nap-bar, header.global-mode .rule,
  header.global-mode #driveBtn, header.global-mode .btn-mini[onclick="copyNAP()"]{display:none}
  .toast.err{background:var(--bad)}
  /* Business/Command tabs go full-bleed — modules manage their own padding */
  main.global-mode{max-width:none;padding:0}
</style>
</head>
<body>

<!-- ===== Passcode gatse ===== -->
<div id="gate">
  <div class="box">
    <h1>Beets &amp; Co</h1>
    <p>Workspace</p>
    <input id="pass" type="password" placeholder="Enter passcode" autocomplete="off"/>
    <button onclick="tryUnlock()">Enter</button>
    <div class="err" id="passErr"></div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app" class="hidden">
  <header>
    <div class="head-top">
      <div class="brand">Beets &amp; Co <small>Workspace</small></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <nav id="sections"></nav>
        <select id="clientPicker" onchange="onChangeClient(this.value)" title="Switch which client's content/calendar/performance you're viewing"></select>
        <button class="btn-mini" onclick="copyNAP()">📋 Copy NAP</button>
        <a id="driveBtn" class="btn-mini" href="#" target="_blank" rel="noopener">📁 Drive folder</a>
        <button class="btn-mini" onclick="lock()">Lock</button>
      </div>
    </div>
    <div class="nap-bar" id="napBar"></div>
    <div class="rule" id="ruleLine"></div>
  </header>

  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<div id="previewModal" class="preview-modal hidden" onclick="if(event.target===this) closePreview()">
  <div class="preview-box">
    <div class="preview-head"><span id="previewTitle"></span><button class="preview-close" onclick="closePreview()">✕</button></div>
    <div class="preview-body" id="previewBody"></div>
  </div>
</div>

<script src="js/workspace.js?v=20260721d"></script>
<script src="js/tax.js?v=20260721d"></script>
<script src="js/command.js?v=20260721d"></script>
<script src="js/business.js?v=20260721d"></script>
</body>
</html>
